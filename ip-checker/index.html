<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>What Is My IP?</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      overflow: hidden;
      color: #fff;
    }

    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(99,102,241,0.15) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(168,85,247,0.12) 0%, transparent 60%),
        radial-gradient(ellipse at 60% 80%, rgba(6,182,212,0.10) 0%, transparent 60%);
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image:
        linear-gradient(rgba(99,102,241,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,102,241,0.05) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: gridMove 20s linear infinite;
    }

    @keyframes gridMove {
      0%   { transform: translateY(0); }
      100% { transform: translateY(50px); }
    }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 48px 40px;
      width: 100%;
      max-width: 520px;
      margin: 20px;
      backdrop-filter: blur(20px);
      box-shadow:
        0 0 0 1px rgba(99,102,241,0.1),
        0 32px 64px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,255,255,0.08);
      animation: fadeIn 0.8s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin: 0 auto 24px;
      box-shadow: 0 8px 32px rgba(99,102,241,0.4);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 8px 32px rgba(99,102,241,0.4); }
      50%       { box-shadow: 0 8px 48px rgba(99,102,241,0.7); }
    }

    h1 {
      text-align: center;
      font-size: 1.1rem;
      font-weight: 400;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .ip-box {
      text-align: center;
      margin: 24px 0 32px;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #ip-address {
      font-size: clamp(2rem, 8vw, 3rem);
      font-weight: 900;
      background: linear-gradient(135deg, #818cf8, #c084fc, #67e8f9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -1px;
      display: none;
      background-size: 200%;
      animation: shimmer 3s linear infinite;
    }

    @keyframes shimmer {
      0%   { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    .loading-dots {
      display: inline-flex;
      gap: 8px;
      align-items: center;
    }

    .loading-dots span {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      animation: bounce 1.2s ease-in-out infinite;
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40%            { transform: scale(1);   opacity: 1;   }
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 28px;
    }

    .info-item {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px;
      padding: 14px 16px;
      transition: border-color 0.3s, background 0.3s;
    }

    .info-item:hover {
      border-color: rgba(99,102,241,0.4);
      background: rgba(99,102,241,0.07);
    }

    .info-label {
      font-size: 0.7rem;
      font-weight: 600;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .info-value {
      font-size: 0.9rem;
      font-weight: 600;
      color: rgba(255,255,255,0.85);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .skeleton {
      background: linear-gradient(90deg,
        rgba(255,255,255,0.05) 25%,
        rgba(255,255,255,0.12) 50%,
        rgba(255,255,255,0.05) 75%);
      background-size: 200%;
      animation: skeleton-shimmer 1.5s infinite;
      border-radius: 6px;
      height: 14px;
      width: 80%;
    }

    @keyframes skeleton-shimmer {
      0%   { background-position: 200% center; }
      100% { background-position: -200% center; }
    }

    .copy-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border: none;
      border-radius: 14px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.03em;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }

    .copy-btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .copy-btn:active { transform: scale(0.98); }

    .copy-btn.copied {
      background: linear-gradient(135deg, #10b981, #059669);
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="grid-bg"></div>

  <div class="card">
    <div class="icon">🌐</div>
    <h1>Your IP Address</h1>

    <div class="ip-box">
      <div class="loading-dots" id="loader">
        <span></span><span></span><span></span>
      </div>
      <span id="ip-address"></span>
    </div>

    <div class="info-grid">
      <div class="info-item">
        <div class="info-label">🌍 Country</div>
        <div class="info-value" id="country"><div class="skeleton"></div></div>
      </div>
      <div class="info-item">
        <div class="info-label">🏙️ City</div>
        <div class="info-value" id="city"><div class="skeleton"></div></div>
      </div>
      <div class="info-item">
        <div class="info-label">📡 ISP</div>
        <div class="info-value" id="isp"><div class="skeleton"></div></div>
      </div>
      <div class="info-item">
        <div class="info-label">⏰ Timezone</div>
        <div class="info-value" id="timezone"><div class="skeleton"></div></div>
      </div>
      <div class="info-item">
        <div class="info-label">🔢 Version</div>
        <div class="info-value" id="ipv6"><div class="skeleton"></div></div>
      </div>
      <div class="info-item">
        <div class="info-label">🔒 Type</div>
        <div class="info-value" id="type"><div class="skeleton"></div></div>
      </div>
    </div>

    <button class="copy-btn" id="copyBtn" onclick="copyIP()">📋 Copy IP Address</button>
    <div class="footer">Your IP is only visible to you &bull; No data is stored</div>
  </div>

  <script>
    let userIP = '';

    async function fetchIP() {
      try {
        // ipwho.is — single request, returns IP + full geo, CORS-friendly from file://
        const res  = await fetch('https://ipwho.is/');
        const data = await res.json();

        if (!data.success) throw new Error('API error');

        userIP = data.ip;

        document.getElementById('loader').style.display = 'none';
        const ipEl = document.getElementById('ip-address');
        ipEl.style.display = 'inline';
        ipEl.textContent = userIP;

        const flag = data.country_code
          ? String.fromCodePoint(...[...data.country_code].map(c => 0x1F1E6 - 65 + c.charCodeAt(0)))
          : '';

        set('country',  flag + ' ' + (data.country || '—') + ' (' + (data.country_code || '—') + ')');
        set('city',     data.city || data.region || '—');
        set('isp',      data.connection && data.connection.isp ? data.connection.isp : '—');
        set('timezone', data.timezone && data.timezone.id ? data.timezone.id : '—');
        set('ipv6',     data.type || 'IPv4');
        set('type',     data.is_eu ? '🇪🇺 EU Network' : data.connection && (data.connection.isp || '').toLowerCase().includes('vpn') ? '🛡️ VPN / Proxy' : '🏠 Residential');
      } catch (e) {
        document.getElementById('loader').style.display = 'none';
        const ipEl = document.getElementById('ip-address');
        ipEl.style.display = 'inline';
        ipEl.textContent = 'Could not fetch';
        ['country','city','isp','timezone','ipv6','type'].forEach(id => set(id, '—'));
      }
    }

    function set(id, val) {
      document.getElementById(id).textContent = val;
    }

    function copyIP() {
      if (!userIP) return;
      navigator.clipboard.writeText(userIP).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.textContent = '✅ Copied to clipboard!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = '📋 Copy IP Address';
          btn.classList.remove('copied');
        }, 2000);
      });
    }

    fetchIP();
  </script>
</body>
</html>
