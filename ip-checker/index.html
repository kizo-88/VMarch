<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IP Checker</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      color: #fff;
      padding: 20px;
    }

    .bg {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(99,102,241,0.15) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(168,85,247,0.12) 0%, transparent 60%),
        radial-gradient(ellipse at 60% 80%, rgba(6,182,212,0.10) 0%, transparent 60%);
    }

    .grid-bg {
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(99,102,241,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,102,241,0.05) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: gridMove 20s linear infinite;
    }
    @keyframes gridMove { 0% { transform:translateY(0); } 100% { transform:translateY(50px); } }

    .card {
      position: relative; z-index: 1;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 40px 36px;
      width: 100%; max-width: 540px;
      backdrop-filter: blur(20px);
      box-shadow: 0 0 0 1px rgba(99,102,241,0.1), 0 32px 64px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.08);
      animation: fadeIn 0.7s ease forwards;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }

    .icon {
      width: 60px; height: 60px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; margin: 0 auto 20px;
      box-shadow: 0 8px 32px rgba(99,102,241,0.4);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 8px 32px rgba(99,102,241,0.4); }
      50%      { box-shadow: 0 8px 48px rgba(99,102,241,0.7); }
    }

    h1 {
      text-align: center; font-size: 1rem; font-weight: 400;
      color: rgba(255,255,255,0.45); letter-spacing: 0.15em;
      text-transform: uppercase; margin-bottom: 20px;
    }

    /* TABS */
    .tabs {
      display: flex; gap: 8px; margin-bottom: 24px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px; padding: 5px;
    }
    .tab {
      flex: 1; padding: 10px;
      border: none; border-radius: 10px;
      font-family: 'Inter', sans-serif; font-size: 0.85rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
      background: transparent; color: rgba(255,255,255,0.4);
    }
    .tab.active {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: #fff;
      box-shadow: 0 4px 16px rgba(99,102,241,0.3);
    }
    .tab:hover:not(.active) { color: rgba(255,255,255,0.7); }

    /* SEARCH BOX */
    .search-row {
      display: flex; gap: 10px; margin-bottom: 24px;
    }
    .search-input {
      flex: 1; padding: 13px 16px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      color: #fff; font-family: 'Inter', sans-serif; font-size: 0.95rem;
      outline: none; transition: border-color 0.2s;
    }
    .search-input::placeholder { color: rgba(255,255,255,0.3); }
    .search-input:focus { border-color: rgba(99,102,241,0.6); }

    .search-btn {
      padding: 13px 20px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border: none; border-radius: 12px;
      color: #fff; font-family: 'Inter', sans-serif;
      font-size: 0.9rem; font-weight: 700;
      cursor: pointer; transition: all 0.2s; white-space: nowrap;
    }
    .search-btn:hover { opacity: 0.88; transform: translateY(-1px); }
    .search-btn:active { transform: scale(0.97); }

    .error-msg {
      display: none; color: #f87171;
      font-size: 0.8rem; margin-top: -16px; margin-bottom: 16px;
      padding: 10px 14px;
      background: rgba(248,113,113,0.1);
      border: 1px solid rgba(248,113,113,0.2);
      border-radius: 10px;
    }

    /* IP DISPLAY */
    .ip-box {
      text-align: center; margin-bottom: 28px;
      min-height: 66px; display: flex; align-items: center; justify-content: center;
    }
    #ip-address {
      font-size: clamp(1.8rem, 7vw, 2.8rem); font-weight: 900;
      background: linear-gradient(135deg, #818cf8, #c084fc, #67e8f9);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; letter-spacing: -1px;
      display: none; background-size: 200%;
      animation: shimmer 3s linear infinite;
    }
    @keyframes shimmer { 0% { background-position:0% center; } 100% { background-position:200% center; } }

    .loading-dots { display: inline-flex; gap: 8px; align-items: center; }
    .loading-dots span {
      width: 12px; height: 12px; border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      animation: bounce 1.2s ease-in-out infinite;
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%,80%,100% { transform:scale(0.6); opacity:0.4; }
      40%          { transform:scale(1);   opacity:1;   }
    }

    /* INFO GRID */
    .info-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 10px; margin-bottom: 24px;
    }
    .info-item {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 13px; padding: 13px 15px;
      transition: border-color 0.3s, background 0.3s;
    }
    .info-item:hover { border-color: rgba(99,102,241,0.4); background: rgba(99,102,241,0.07); }
    .info-label { font-size: 0.68rem; font-weight: 600; color: rgba(255,255,255,0.35); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 5px; }
    .info-value { font-size: 0.87rem; font-weight: 600; color: rgba(255,255,255,0.85); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .skeleton {
      background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.12) 50%, rgba(255,255,255,0.05) 75%);
      background-size: 200%; animation: sk 1.5s infinite;
      border-radius: 6px; height: 13px; width: 75%;
    }
    @keyframes sk { 0% { background-position:200% center; } 100% { background-position:-200% center; } }

    /* BUTTONS */
    .btn-row { display: flex; gap: 10px; }
    .copy-btn {
      flex: 1; padding: 13px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border: none; border-radius: 13px;
      color: #fff; font-family: 'Inter', sans-serif;
      font-size: 0.9rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
    }
    .copy-btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .copy-btn:active { transform: scale(0.98); }
    .copy-btn.copied { background: linear-gradient(135deg, #10b981, #059669); }

    .my-ip-btn {
      padding: 13px 16px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 13px;
      color: rgba(255,255,255,0.6); font-family: 'Inter', sans-serif;
      font-size: 0.9rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s; white-space: nowrap;
    }
    .my-ip-btn:hover { border-color: rgba(99,102,241,0.5); color: #fff; }

    .footer { text-align: center; margin-top: 18px; font-size: 0.7rem; color: rgba(255,255,255,0.18); }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="grid-bg"></div>

  <div class="card">
    <div class="icon">🌐</div>
    <h1>IP Address Checker</h1>

    <!-- TABS -->
    <div class="tabs">
      <button class="tab active" id="tab-my"  onclick="switchTab('my')">📍 My IP</button>
      <button class="tab"        id="tab-lookup" onclick="switchTab('lookup')">🔍 Lookup IP</button>
    </div>

    <!-- SEARCH ROW (hidden by default) -->
    <div class="search-row" id="search-row" style="display:none;">
      <input class="search-input" id="ip-input" type="text"
             placeholder="Enter IP address e.g. 8.8.8.8"
             onkeydown="if(event.key==='Enter') lookupIP()"/>
      <button class="search-btn" onclick="lookupIP()">🔎 Search</button>
    </div>
    <div class="error-msg" id="error-msg">⚠️ Invalid IP address. Please enter a valid IPv4 or IPv6 address.</div>

    <!-- IP DISPLAY -->
    <div class="ip-box">
      <div class="loading-dots" id="loader"><span></span><span></span><span></span></div>
      <span id="ip-address"></span>
    </div>

    <!-- INFO GRID -->
    <div class="info-grid">
      <div class="info-item"><div class="info-label">🌍 Country</div><div class="info-value" id="country"><div class="skeleton"></div></div></div>
      <div class="info-item"><div class="info-label">🏙️ City</div><div class="info-value" id="city"><div class="skeleton"></div></div></div>
      <div class="info-item"><div class="info-label">📡 ISP</div><div class="info-value" id="isp"><div class="skeleton"></div></div></div>
      <div class="info-item"><div class="info-label">⏰ Timezone</div><div class="info-value" id="timezone"><div class="skeleton"></div></div></div>
      <div class="info-item"><div class="info-label">🔢 Version</div><div class="info-value" id="ipv6"><div class="skeleton"></div></div></div>
      <div class="info-item"><div class="info-label">🔒 Type</div><div class="info-value" id="type"><div class="skeleton"></div></div></div>
      <div class="info-item"><div class="info-label">📍 Region</div><div class="info-value" id="region"><div class="skeleton"></div></div></div>
      <div class="info-item"><div class="info-label">📮 Postal</div><div class="info-value" id="postal"><div class="skeleton"></div></div></div>
    </div>

    <!-- BUTTONS -->
    <div class="btn-row">
      <button class="copy-btn" id="copyBtn" onclick="copyIP()">📋 Copy IP</button>
      <button class="my-ip-btn" id="resetBtn" onclick="resetToMyIP()" style="display:none;">↩ My IP</button>
    </div>
    <div class="footer">No data is stored &bull; For educational use only</div>
  </div>

  <script>
    let currentIP  = '';
    let currentTab = 'my';

    /* ── helpers ─────────────────────────────── */
    function showLoading() {
      document.getElementById('loader').style.display = 'flex';
      document.getElementById('ip-address').style.display = 'none';
      document.getElementById('ip-address').textContent = '';
      ['country','city','isp','timezone','ipv6','type','region','postal'].forEach(id => {
        document.getElementById(id).innerHTML = '<div class="skeleton"></div>';
      });
      document.getElementById('error-msg').style.display = 'none';
    }

    function showError(msg) {
      document.getElementById('loader').style.display = 'none';
      const el = document.getElementById('error-msg');
      el.textContent = '⚠️ ' + msg;
      el.style.display = 'block';
    }

    function renderData(data) {
      if (!data.success && data.message) { showError(data.message); return; }

      currentIP = data.ip;

      document.getElementById('loader').style.display = 'none';
      const ipEl = document.getElementById('ip-address');
      ipEl.style.display = 'inline';
      ipEl.textContent   = currentIP;

      const flag = data.country_code
        ? String.fromCodePoint(...[...data.country_code].map(c => 0x1F1E6 - 65 + c.charCodeAt(0)))
        : '';

      set('country',  flag + ' ' + (data.country || '—') + ' (' + (data.country_code || '—') + ')');
      set('city',     data.city || '—');
      set('region',   data.region || '—');
      set('postal',   data.postal || '—');
      set('isp',      data.connection && data.connection.isp ? data.connection.isp : '—');
      set('timezone', data.timezone && data.timezone.id ? data.timezone.id : '—');
      set('ipv6',     data.type || 'IPv4');
      set('type',     data.is_eu
        ? '🇪🇺 EU Network'
        : data.connection && (data.connection.isp || '').toLowerCase().includes('vpn')
          ? '🛡️ VPN / Proxy'
          : '🏠 Residential');
    }

    function set(id, val) { document.getElementById(id).textContent = val; }

    function isValidIP(ip) {
      const v4 = /^(\d{1,3}\.){3}\d{1,3}$/;
      const v6 = /^[0-9a-fA-F:]+$/;
      return v4.test(ip.trim()) || v6.test(ip.trim());
    }

    /* ── tab switching ───────────────────────── */
    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tab-my').classList.toggle('active',     tab === 'my');
      document.getElementById('tab-lookup').classList.toggle('active', tab === 'lookup');
      document.getElementById('search-row').style.display = tab === 'lookup' ? 'flex' : 'none';
      document.getElementById('resetBtn').style.display   = tab === 'lookup' ? 'inline-block' : 'none';
      document.getElementById('error-msg').style.display  = 'none';
      if (tab === 'my') { showLoading(); fetchMyIP(); }
    }

    /* ── fetch my IP ─────────────────────────── */
    async function fetchMyIP() {
      showLoading();
      try {
        const res  = await fetch('https://ipwho.is/');
        const data = await res.json();
        renderData(data);
      } catch(e) {
        showError('Could not fetch your IP. Check your internet connection.');
      }
    }

    /* ── lookup any IP ───────────────────────── */
    async function lookupIP() {
      const input = document.getElementById('ip-input').value.trim();
      if (!input) { showError('Please enter an IP address.'); return; }
      if (!isValidIP(input)) { showError('Invalid IP address. Example: 8.8.8.8'); return; }

      showLoading();
      try {
        const res  = await fetch('https://ipwho.is/' + input);
        const data = await res.json();
        renderData(data);
      } catch(e) {
        showError('Could not look up that IP. Try again.');
      }
    }

    /* ── reset to my IP ──────────────────────── */
    function resetToMyIP() {
      document.getElementById('ip-input').value = '';
      showLoading();
      fetchMyIP();
    }

    /* ── copy ────────────────────────────────── */
    function copyIP() {
      if (!currentIP) return;
      navigator.clipboard.writeText(currentIP).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.textContent = '✅ Copied!';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = '📋 Copy IP'; btn.classList.remove('copied'); }, 2000);
      });
    }

    /* ── init ────────────────────────────────── */
    fetchMyIP();
  </script>
</body>
</html>
